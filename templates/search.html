{% extends "base.html" %}
{% load static %}
{% block content %}

<h2>Search results for "{{ query }}"</h2>

<div class="row mt-3">
    {% if products %}
        {% for product in products %}
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm">

                <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">

                <div class="card-body text-center">
                    <h5>{{ product.name }}</h5>
                    <p>₹ {{ product.price }}</p>

                    <a href="{% url 'add' product.id %}" class="btn btn-success">
                        Add to Cart
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <h5 class="text-center mt-3">No products found</h5>
    {% endif %}
</div>

{% endblock %}
