{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Chat | BigBasket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
    }

    .chat-container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .chat-header {
      background: #dc3545;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .chat-body {
      height: 420px;
      padding: 15px;
      overflow-y: auto;
      background: #f9f9f9;
    }

    .message {
      margin-bottom: 12px;
      max-width: 70%;
      padding: 10px 15px;
      border-radius: 20px;
      font-size: 0.95rem;
      clear: both;
    }

    .user-message {
      background: #dc3545;
      color: white;
      float: right;
      border-bottom-right-radius: 5px;
    }

    .bot-message {
      background: #e9ecef;
      color: #000;
      float: left;
      border-bottom-left-radius: 5px;
    }

    .chat-footer {
      padding: 15px;
      background: #fff;
      border-top: 1px solid #ddd;
    }
  </style>
</head>

<body>

{% include 'navbar.html' %}

<div class="chat-container">
  <div class="chat-header">
    💬 Live Chat Support
  </div>

  <div class="chat-body" id="chatBody">
    <div class="message bot-message">
      👋 Hello {{ user.username }}, welcome to BigBasket Live Support!
    </div>
    <div class="message bot-message">
      How can we help you today?
    </div>
  </div>

  <div class="chat-footer">
    <div class="input-group">
      <input type="text" id="chatInput" class="form-control" placeholder="Type your message...">
      <button class="btn btn-danger" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function sendMessage() {
    const input = document.getElementById("chatInput");
    const message = input.value.trim();
    if (message === "") return;

    const chatBody = document.getElementById("chatBody");

    // User message
    const userMsg = document.createElement("div");
    userMsg.className = "message user-message";
    userMsg.innerText = message;
    chatBody.appendChild(userMsg);

    input.value = "";

    chatBody.scrollTop = chatBody.scrollHeight;

    // Fake bot reply
    setTimeout(() => {
      const botMsg = document.createElement("div");
      botMsg.className = "message bot-message";
      botMsg.innerText = "✅ Thanks for your message! Our support team will reply soon.";
      chatBody.appendChild(botMsg);
      chatBody.scrollTop = chatBody.scrollHeight;
    }, 1000);
  }
</script>

</body>
</html>
