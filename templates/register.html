{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Login Page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Background Section */
body {
  background: url("{% static 'image/loginback.jpg' %}");
  background-repeat: no-repeat;
  background-position: center; 
  background-size:cover;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', sans-serif;
}

/* Login Card */
.login-box {
  backdrop-filter: blur(15px);
  background: rgba(255, 255, 255, 0.15);
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(0,0,0,0.3);
  padding: 50px 40px;
  width: 460px;
  text-align: center;
  color: white;
}

.login-box img{
  padding: 20px;
}

.login-box h2 {
  font-weight: 600;
  margin-bottom: 20px;
}

.login-box p {
  font-size: 14px;
  color: #f1f1f1;
}

/* Input Styling */
.form-control {
  background: rgba(255, 255, 255, 0.25);
  border: none;
  color: #fff;
  border-radius: 10px;
}

.form-control::placeholder {
  color: #eee;
}

/* Button */
.btn-custom {
  background: #ff914d;
  border: none;
  border-radius: 10px;
  padding: 10px;
  font-weight: 600;
  width: 100%;
  color: white;
  transition: all 0.3s ease;
}

.btn-custom:hover {
  background: #ff6f00;
}

/* Links */
a {
  color: #0d7be9;
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
.tag{
    text-decoration: none;
    color: white;
}
</style>
</head>

<body>



  {% if messages %}
  <ul>
    {% for message in messages %}
      <li style="color: red;">{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}



  <div class="login-box">
    <img src="{% static 'image/logobb.png'%}" width="300" alt="Food Logo">
    <h2>Welcome to BigBasket</h2>
    <p>Get fresh fruits, vegetables, and groceries delivered to your doorstep</p>

<form method="POST" action="{% url 'register' %}">
    {% csrf_token %}
    
    <div class="mb-3">
        <label class="form-label text-white">Username</label>
        <input type="text" name="username" class="form-control" required>
    </div>
    
    <div class="mb-3">
        <label class="form-label text-white">Email</label>
        <input type="email" name="email" class="form-control" required>
    </div>
    
    <div class="mb-3">
        <label class="form-label text-white">Password</label>
        <input type="password" name="password" class="form-control" required>
    </div>
    
    <button type="submit" class="btn btn-primary">Register</button>
</form>





  </div>
</body>
</html>
