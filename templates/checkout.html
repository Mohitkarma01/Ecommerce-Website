{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | BigBasket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        .checkout-container { max-width: 800px; margin: 40px auto; }
        .checkout-card { background: white; border-radius: 10px; padding: 30px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        .order-summary { background: #f8f9fa; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="container checkout-container">
        <h2 class="text-center mb-4">Checkout</h2>
        
        <div class="checkout-card">
            <!-- In checkout.html form -->
<form method="POST" action="{% url 'checkout' %}">
    {% csrf_token %}
    
    <div class="row">
        <!-- Shipping Details -->
        <div class="col-md-6">
            <h4>Shipping Details</h4>
            
            <div class="mb-3">
                <label class="form-label">Full Address</label>
                <textarea name="address" class="form-control" rows="3" required>
                    {% if address %}{{ address.full_address }}{% endif %}
                </textarea>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="form-control" 
                           value="{% if address %}{{ address.city }}{% endif %}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Pincode</label>
                    <input type="text" name="pincode" class="form-control" 
                           value="{% if address %}{{ address.pincode }}{% endif %}" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control" 
                       value="{% if address %}{{ address.phone }}{% endif %}" required>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-danger btn-lg">
                    Place Order - ₹{{ total }}
                </button>
            </div>
        </div>
    </div>
</form>
        </div>
    </div>
</body>
</html>
